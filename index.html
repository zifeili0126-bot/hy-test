 function commerce(p){const names=[&#x27;首款&#x27;,&#x27;方案节点款&#x27;,&#x27;施工图节点款&#x27;,&#x27;尾款&#x27;];return `&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-sub&quot;&gt;${pre(p)?&#x27;全项目报价&#x27;:&#x27;全项目合同总价&#x27;}&lt;/div&gt;&lt;div class=&quot;hy-amount&quot;&gt;${money(total(p))}&lt;/div&gt;${!pre(p)?`&lt;div class=&quot;hy-row&quot;&gt;&lt;span&gt;已到账 ${money(paid(p))}&lt;/span&gt;&lt;span class=&quot;hy-sub&quot;&gt;未收 ${money(total(p)-paid(p))}&lt;/span&gt;&lt;/div&gt;`:&#x27;&lt;p class=&quot;hy-sub&quot;&gt;报价确认后签订全阶段服务合同。&lt;/p&gt;&#x27;}${entry(&#x27;服务方案与报价&#x27;,p.mode===&#x27;quote&#x27;?&#x27;待您确认&#x27;:&#x27;已确认的服务范围与报价&#x27;,&#x27;quote&#x27;)}${entry(&#x27;全阶段服务合同&#x27;,p.mode===&#x27;quote&#x27;?&#x27;确认报价后进入签约&#x27;:p.mode===&#x27;sign&#x27;?&#x27;待签署&#x27;:&#x27;双方已签署&#x27;,&#x27;contract&#x27;)}&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;分阶段付款计划&lt;/h3&gt;${names.map((n,i)=&gt;entry(n+&#x27; · &#x27;+money(parts(p)[i]),paymentStatus(p,i),&#x27;payment&#x27;,String(i))).join(&#x27;&#x27;)}&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;${entry(&#x27;增补与范围变更&#x27;,p.addendum===&#x27;pending&#x27;?&#x27;新增会议室设计 · 待确认&#x27;:p.addendum===&#x27;accepted&#x27;?&#x27;新增会议室设计 · 已确认&#x27;:p.addendum===&#x27;declined&#x27;?&#x27;有一份未接受的增补&#x27;:&#x27;暂无增补&#x27;,&#x27;addendum&#x27;)}${entry(&#x27;开票与其他服务问题&#x27;,&#x27;联系负责人，由平台人工处理&#x27;,&#x27;feedback&#x27;,&#x27;开票申请&#x27;)}&lt;/section&gt;`;}
 function detailPage(p){const tab=[&#x27;overview&#x27;,&#x27;results&#x27;,&#x27;commerce&#x27;].includes(s.route.tab)?s.route.tab:&#x27;overview&#x27;;return header(p.name,`${p.area}㎡ · ${pre(p)?&#x27;售前沟通&#x27;:&#x27;全阶段设计服务&#x27;} · ${status(p)}`)+`&lt;nav class=&quot;hy-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;项目内容&quot;&gt;${[[&#x27;overview&#x27;,&#x27;概览&#x27;],[&#x27;results&#x27;,&#x27;成果&#x27;],[&#x27;commerce&#x27;,&#x27;合同与款项&#x27;]].map(([k,n])=&gt;`&lt;button id=&quot;hy-tab-${k}&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;hy-panel&quot; aria-selected=&quot;${tab===k}&quot; data-action=&quot;tab&quot; data-tab=&quot;${k}&quot;&gt;${n}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;main id=&quot;hy-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;hy-tab-${tab}&quot; class=&quot;hy-body&quot;&gt;${tab===&#x27;overview&#x27;?overview(p):tab===&#x27;results&#x27;?results(p):commerce(p)}&lt;/main&gt;`;}
 function quote(p){return `&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-kicker&quot;&gt;办公空间全阶段设计 · 示例方案&lt;/div&gt;&lt;div class=&quot;hy-amount&quot;&gt;${money(p.base)}&lt;/div&gt;&lt;p class=&quot;hy-sub&quot;&gt;一次签约覆盖全部约定服务，按合同节点付款。&lt;/p&gt;${data([[&#x27;设计面积&#x27;,p.area+&#x27;㎡&#x27;],[&#x27;服务阶段&#x27;,&#x27;策划、概念、方案、施工图、现场配合及验收结算&#x27;],[&#x27;预计周期&#x27;,&#x27;设计阶段约 45 个工作日；现场配合按施工计划安排&#x27;],[&#x27;修改范围&#x27;,&#x27;各阶段含 2 轮约定范围内的集中修改（示例）&#x27;]])}&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;阶段成果&lt;/h3&gt;&lt;ul class=&quot;hy-list&quot;&gt;&lt;li&gt;策划与概念：需求梳理、布局方向、风格意向&lt;/li&gt;&lt;li&gt;方案设计：布局方案、效果表达、材料意向&lt;/li&gt;&lt;li&gt;施工图：约定专业的施工图纸与交底资料&lt;/li&gt;&lt;li&gt;现场及验收：约定次数的配合记录、成果交接&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;付款约定&lt;/h3&gt;${data([[&#x27;首款&#x27;,money(p.base*.3)+&#x27; · 双方签约后&#x27;],[&#x27;方案节点&#x27;,money(p.base*.3)+&#x27; · 方案成果确认后&#x27;],[&#x27;施工图节点&#x27;,money(p.base*.3)+&#x27; · 施工图成果确认后&#x27;],[&#x27;尾款&#x27;,money(p.base*.1)+&#x27; · 约定验收完成后&#x27;]])}&lt;div class=&quot;hy-sub&quot;&gt;比例、周期和修改次数均为原型示例，待业务方确定。&lt;/div&gt;&lt;/section&gt;${p.mode===&#x27;quote&#x27;?`&lt;div class=&quot;hy-actions&quot;&gt;${btn(&#x27;有疑问&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;feedback&quot; data-arg=&quot;报价问题&quot;&#x27;,&#x27;hy-secondary&#x27;)}${btn(&#x27;确认方案与报价&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;quote&quot;&#x27;)}&lt;/div&gt;`:p.mode===&#x27;sign&#x27;?btn(&#x27;查看待签合同&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;contract&quot;&#x27;):&#x27;&lt;p class=&quot;hy-sub&quot;&gt;已确认的方案保留在本项目中。&lt;/p&gt;&#x27;}`;}
 function contract(p){return `&lt;section class=&quot;hy-box&quot;&gt;&lt;span class=&quot;hy-tag&quot;&gt;${p.mode===&#x27;quote&#x27;?&#x27;待生成&#x27;:p.mode===&#x27;sign&#x27;?&#x27;待签署&#x27;:&#x27;双方已签署 · 演示&#x27;}&lt;/span&gt;&lt;h2&gt;办公空间设计服务合同&lt;/h2&gt;${data([[&#x27;项目&#x27;,p.name],[&#x27;合同范围&#x27;,&#x27;全阶段设计服务&#x27;],[&#x27;合同总价&#x27;,money(p.base)],[&#x27;付款方式&#x27;,&#x27;分阶段付款&#x27;],[&#x27;签约状态&#x27;,pre(p)?&#x27;尚未完成双方签署&#x27;:&#x27;客户与公司均已完成签署（示例）&#x27;]])}&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;合同内容摘要&lt;/h3&gt;&lt;p&gt;服务范围、阶段成果与确认标准、服务周期、付款节点、修改与增补、暂停及终止处理。&lt;/p&gt;&lt;p class=&quot;hy-sub&quot;&gt;实际合同文本与签署方式由业务方另行确定，本页仅演示结构。&lt;/p&gt;${entry(&#x27;查看关联服务方案&#x27;,&#x27;完整范围、阶段成果与报价&#x27;,&#x27;quote&#x27;)}&lt;/section&gt;${p.mode===&#x27;quote&#x27;?btn(&#x27;先确认服务方案&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;quote&quot;&#x27;):p.mode===&#x27;sign&#x27;?`&lt;label class=&quot;hy-check&quot;&gt;&lt;input id=&quot;hy-contract-check&quot; type=&quot;checkbox&quot;&gt;&lt;span&gt;已查看本次全阶段服务范围、总价及付款计划。&lt;/span&gt;&lt;/label&gt;&lt;div id=&quot;hy-form-error&quot; class=&quot;hy-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;${btn(&#x27;演示完成双方签署&#x27;,&#x27;sign&#x27;)}`:btn(&#x27;查看合同归档&#x27;,&#x27;notice&#x27;,&#x27;data-message=&quot;合同已归档。本原型不包含真实合同文件。&quot;&#x27;,&#x27;hy-secondary&#x27;)}`;}
 function result(p,old=false){const v=old?1:p.version,allowed=p.paid[1]||p.mode===&#x27;complete&#x27;;return `&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-row&quot;&gt;&lt;h2&gt;方案设计成果 V${v}&lt;/h2&gt;&lt;span class=&quot;hy-tag&quot;&gt;${old?&#x27;历史版本&#x27;:[&#x27;review&#x27;,&#x27;revising&#x27;].includes(p.mode)?status(p):&#x27;已确认&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hy-sub&quot;&gt;方案设计 · 已审核发布 · ${allowed?&#x27;原文件可下载&#x27;:&#x27;评审版可查看&#x27;}&lt;/div&gt;&lt;div class=&quot;hy-preview&quot;&gt;&lt;div class=&quot;hy-kicker&quot;&gt;布局方案 · 演示缩略图&lt;/div&gt;&lt;div class=&quot;hy-plan&quot; aria-label=&quot;办公室布局示意，非实际设计成果&quot;&gt;&lt;span&gt;会议区&lt;/span&gt;&lt;span class=&quot;hy-open&quot;&gt;开放办公区&lt;/span&gt;&lt;span&gt;经理室&lt;/span&gt;&lt;span&gt;接待区&lt;/span&gt;&lt;span&gt;茶水区&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hy-sub&quot;&gt;布局与动线、设计效果、材料意向&lt;/div&gt;&lt;/div&gt;${entry(&#x27;打开评审内容&#x27;,&#x27;查看本次成果清单与评审要点&#x27;,&#x27;preview&#x27;,old?&#x27;old&#x27;:&#x27;latest&#x27;)}&lt;/section&gt;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;本次修改说明&lt;/h3&gt;&lt;p&gt;${old?&#x27;首版方案，已由后续版本更新。&#x27;:&#x27;依据上一轮沟通调整会议区位置，并补充材料意向。&#x27;}&lt;/p&gt;${p.comment&amp;&amp;!old?`&lt;div class=&quot;hy-note&quot;&gt;已提交意见：${esc(p.comment)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;hy-sub&quot;&gt;确认与修改意见均关联具体版本。历史版本保留，不直接覆盖。&lt;/div&gt;&lt;/section&gt;${old?&#x27;&lt;div class=&quot;hy-note&quot;&gt;历史版本仅供查看，确认操作请进入最新版本。&lt;/div&gt;&#x27;:p.mode===&#x27;review&#x27;?`&lt;div class=&quot;hy-note&quot;&gt;本示例中，确认后将产生方案节点应付款 ${money(parts(p)[1])}。&lt;/div&gt;&lt;div class=&quot;hy-actions&quot;&gt;${btn(&#x27;提出修改意见&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;revision&quot;&#x27;,&#x27;hy-secondary&#x27;)}${btn(&#x27;确认本阶段成果&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;result&quot;&#x27;)}&lt;/div&gt;`:p.mode===&#x27;revising&#x27;?btn(&#x27;查看已提交意见&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;revision&quot;&#x27;,&#x27;hy-secondary&#x27;):allowed?btn(&#x27;下载原文件&#x27;,&#x27;download&#x27;):btn(p.mode===&#x27;checking&#x27;?&#x27;查看款项核对进度&#x27;:&#x27;查看对应款项&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;payment&quot; data-arg=&quot;1&quot;&#x27;)}`;}
 function payment(p,i){const ns=[&#x27;首款&#x27;,&#x27;方案节点款&#x27;,&#x27;施工图节点款&#x27;,&#x27;尾款&#x27;],amount=parts(p)[i],st=paymentStatus(p,i);let action=&#x27;&#x27;;
  if(st===&#x27;待付款&#x27;)action=`&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;付款与核对&lt;/h3&gt;&lt;p&gt;根据合同约定办理付款，并通过项目负责人获取收款信息。&lt;/p&gt;&lt;div class=&quot;hy-note&quot;&gt;此为演示，无真实收款码或银行账号。&lt;/div&gt;${btn(&#x27;我已付款，通知核对&#x27;,&#x27;confirm&#x27;,`data-kind=&quot;remit&quot; data-index=&quot;${i}&quot;`)}&lt;/section&gt;`;
  else if(st===&#x27;核对中&#x27;)action=&#x27;&lt;div class=&quot;hy-note&quot;&gt;已通知平台核对，当前尚未登记到账。不会提前解锁文件或启动下一阶段。&lt;/div&gt;&#x27;;
  else if(st===&#x27;已到账&#x27;)action=btn(&#x27;查看对应成果&#x27;,&#x27;item&#x27;,`data-item=&quot;${i===0?&#x27;concept&#x27;:i===1?&#x27;result&#x27;:&#x27;final&#x27;}&quot; data-arg=&quot;latest&quot;`,&#x27;hy-secondary&#x27;);
  else action=&#x27;&lt;p class=&quot;hy-sub&quot;&gt;尚未满足付款条件，当前无需支付。&lt;/p&gt;&#x27;;
  return `&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-row&quot;&gt;&lt;h3&gt;${ns[i]}&lt;/h3&gt;&lt;span class=&quot;hy-tag&quot;&gt;${st}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hy-amount&quot;&gt;${money(amount)}&lt;/div&gt;${data([[&#x27;所属合同&#x27;,p.name+&#x27;全阶段服务合同&#x27;],[&#x27;付款条件&#x27;,[&#x27;双方签约后&#x27;,&#x27;方案成果确认后&#x27;,&#x27;施工图成果确认后&#x27;,&#x27;约定验收完成后&#x27;][i]],[&#x27;到期时间&#x27;,st===&#x27;待付款&#x27;||st===&#x27;核对中&#x27;?&#x27;2026年10月28日（示例）&#x27;:st===&#x27;已到账&#x27;?&#x27;已按约完成&#x27;:&#x27;条件满足后生成&#x27;],[&#x27;到账情况&#x27;,p.paid[i]?&#x27;已核实到账&#x27;:&#x27;尚未核实到账&#x27;]])}&lt;/section&gt;${action}&lt;section class=&quot;hy-box&quot;&gt;${entry(&#x27;开票或付款问题&#x27;,&#x27;联系项目负责人&#x27;,&#x27;feedback&#x27;,&#x27;付款与开票&#x27;)}${entry(&#x27;查看完整付款计划&#x27;,&#x27;合同总价、已到账与其余节点&#x27;,&#x27;payments&#x27;)}&lt;/section&gt;`;}
 function schedule(p){return p.schedule===&#x27;none&#x27;?&#x27;&lt;div class=&quot;hy-box&quot;&gt;&lt;h3&gt;暂无改期记录&lt;/h3&gt;&lt;p class=&quot;hy-sub&quot;&gt;有日期调整时，会展示原日期、新日期、原因及确认记录。&lt;/p&gt;&lt;/div&gt;&#x27;:`&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-row&quot;&gt;&lt;h2&gt;施工图交付日期调整&lt;/h2&gt;&lt;span class=&quot;hy-tag&quot;&gt;${p.schedule===&#x27;pending&#x27;?&#x27;待确认&#x27;:p.schedule===&#x27;accepted&#x27;?&#x27;已同意&#x27;:&#x27;待进一步沟通&#x27;}&lt;/span&gt;&lt;/div&gt;${data([[&#x27;原日期&#x27;,&#x27;2026年11月20日&#x27;],[&#x27;新日期&#x27;,&#x27;2026年11月23日&#x27;],[&#x27;提出原因&#x27;,&#x27;根据补充的现场条件，需增加协调时间（示例）&#x27;],[&#x27;费用影响&#x27;,&#x27;不增加费用&#x27;],[&#x27;范围影响&#x27;,&#x27;服务范围保持不变&#x27;]])}&lt;p class=&quot;hy-sub&quot;&gt;确认后更新预计交付日，并保留原日期及本次记录。&lt;/p&gt;&lt;/section&gt;${p.schedule===&#x27;pending&#x27;?`&lt;div class=&quot;hy-actions&quot;&gt;${btn(&#x27;不同意，需沟通&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;scheduleNo&quot;&#x27;,&#x27;hy-secondary&#x27;)}${btn(&#x27;同意改期&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;scheduleYes&quot;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`;}
 function addendum(p){return p.addendum===&#x27;none&#x27;?&#x27;&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;暂无增补&lt;/h3&gt;&lt;p class=&quot;hy-sub&quot;&gt;原合同范围外的新增服务，在确认范围、费用和工期影响后执行。&lt;/p&gt;&lt;/section&gt;&#x27;:`&lt;section class=&quot;hy-box&quot;&gt;&lt;span class=&quot;hy-tag&quot;&gt;${p.addendum===&#x27;pending&#x27;?&#x27;待您确认&#x27;:p.addendum===&#x27;accepted&#x27;?&#x27;已确认&#x27;:&#x27;未接受，按原合同履行&#x27;}&lt;/span&gt;&lt;h2&gt;新增独立会议室设计&lt;/h2&gt;${data([[&#x27;新增内容&#x27;,&#x27;新增一间会议室的方案及施工图&#x27;],[&#x27;新增费用&#x27;,&#x27;¥6,000&#x27;],[&#x27;付款安排&#x27;,&#x27;并入施工图节点款，不增加当前方案节点应付&#x27;],[&#x27;工期影响&#x27;,&#x27;施工图交付延后 3 个工作日：11月20日 → 11月25日（示例）&#x27;],[&#x27;调整后总价&#x27;,money(p.base+6000)]])}&lt;/section&gt;${p.addendum===&#x27;pending&#x27;?`&lt;div class=&quot;hy-actions&quot;&gt;${btn(&#x27;暂不接受&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;addendumNo&quot;&#x27;,&#x27;hy-secondary&#x27;)}${btn(&#x27;确认增补&#x27;,&#x27;confirm&#x27;,&#x27;data-kind=&quot;addendumYes&quot;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}`;}
 function formPage(p,revision){const title=revision?&#x27;提交修改意见&#x27;:&#x27;联系项目负责人&#x27;,value=revision?(p.revisionDraft??p.comment):(p.feedbackDraft||&#x27;&#x27;);return `&lt;section class=&quot;hy-box&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;div class=&quot;hy-sub&quot;&gt;${revision?&#x27;关联：方案设计成果 V&#x27;+p.version:&#x27;负责人：&#x27;+p.contact+&#x27; · 本项目专属跟进&#x27;}&lt;/div&gt;${revision?&#x27;&#x27;:`&lt;label for=&quot;hy-topic&quot;&gt;问题类型&lt;/label&gt;&lt;select id=&quot;hy-topic&quot;&gt;${[&#x27;服务咨询&#x27;,&#x27;报价问题&#x27;,&#x27;付款与开票&#x27;,&#x27;改期或增补&#x27;,&#x27;换团队或解约&#x27;].map(v=&gt;`&lt;option ${s.route.arg&amp;&amp;v.includes(s.route.arg.slice(0,2))?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${v}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;`}&lt;label for=&quot;hy-message&quot;&gt;${revision?&#x27;请集中说明希望调整的内容&#x27;:&#x27;请说明需要协助的事项&#x27;}&lt;/label&gt;&lt;textarea id=&quot;hy-message&quot; maxlength=&quot;1000&quot; placeholder=&quot;例如：希望调整会议室布局，请先确认是否影响交付时间。&quot;&gt;${esc(value)}&lt;/textarea&gt;&lt;div id=&quot;hy-form-error&quot; class=&quot;hy-error&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;&lt;p class=&quot;hy-sub&quot;&gt;${revision?&#x27;负责人会先核对修改范围；涉及新增费用时，另行提交增补确认。&#x27;:&#x27;请求会关联到本项目，由负责人跟进。&#x27;}&lt;/p&gt;${btn(revision?&#x27;提交修改意见&#x27;:&#x27;提交给负责人&#x27;,revision?&#x27;submitRevision&#x27;:&#x27;submitFeedback&#x27;)}${!revision&amp;&amp;p.request?`&lt;hr class=&quot;hy-line&quot;&gt;&lt;h3&gt;最近提交的请求&lt;/h3&gt;&lt;div class=&quot;hy-sub&quot;&gt;${esc(p.request.topic)} · 待负责人处理&lt;/div&gt;&lt;p&gt;${esc(p.request.text)}&lt;/p&gt;`:&#x27;&#x27;}&lt;/section&gt;`;}
 function itemPage(p){const k=s.route.item,a=s.route.arg;let title=&#x27;&#x27;,content=&#x27;&#x27;;
  if(k===&#x27;quote&#x27;){title=&#x27;服务方案与报价&#x27;;content=quote(p);}
  else if(k===&#x27;contract&#x27;){title=&#x27;全阶段服务合同&#x27;;content=contract(p);}
  else if(k===&#x27;result&#x27;){title=&#x27;成果详情&#x27;;content=result(p,a===&#x27;old&#x27;);}
  else if(k===&#x27;history&#x27;){title=&#x27;历史版本&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;${entry(&#x27;方案设计 V&#x27;+p.version,&#x27;当前版本 · &#x27;+status(p),&#x27;result&#x27;,&#x27;latest&#x27;)}${entry(&#x27;方案设计 V1&#x27;,&#x27;历史版本 · 修改记录保留&#x27;,&#x27;result&#x27;,&#x27;old&#x27;)}&lt;/section&gt;${p.comment?`&lt;section class=&quot;hy-box&quot;&gt;&lt;h3&gt;客户修改意见&lt;/h3&gt;&lt;p&gt;${esc(p.comment)}&lt;/p&gt;&lt;div class=&quot;hy-sub&quot;&gt;关联 V${p.version} · 已提交，等待负责人处理&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}`;}
  else if(k===&#x27;revision&#x27;){title=&#x27;修改意见&#x27;;content=formPage(p,true);}
  else if(k===&#x27;payment&#x27;){title=&#x27;付款详情&#x27;;content=payment(p,Math.max(0,Math.min(3,Number(a)||0)));}
  else if(k===&#x27;payments&#x27;){title=&#x27;合同与付款计划&#x27;;content=commerce(p);}
  else if(k===&#x27;schedule&#x27;){title=&#x27;改期详情&#x27;;content=schedule(p);}
  else if(k===&#x27;addendum&#x27;){title=&#x27;增补详情&#x27;;content=addendum(p);}
  else if(k===&#x27;feedback&#x27;){title=&#x27;联系负责人&#x27;;content=formPage(p,false);}
  else if(k===&#x27;info&#x27;){title=&#x27;项目信息&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;${data([[&#x27;项目名称&#x27;,p.name],[&#x27;空间类型&#x27;,&#x27;办公空间&#x27;],[&#x27;设计面积&#x27;,p.area+&#x27;㎡&#x27;],[&#x27;项目位置&#x27;,p.address],[&#x27;核心需求&#x27;,&#x27;优化办公动线，兼顾协作空间与独立会议需求。&#x27;],[&#x27;合同范围&#x27;,&#x27;全阶段设计服务；具体内容见合同&#x27;]])}&lt;/section&gt;${btn(&#x27;需求有变化，联系负责人&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;feedback&quot;&#x27;,&#x27;hy-secondary&#x27;)}`;}
  else if(k===&#x27;team&#x27;){title=&#x27;服务团队&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;&lt;h2&gt;禾一办公设计团队&lt;/h2&gt;&lt;p class=&quot;hy-sub&quot;&gt;当前项目团队 · 示例成员&lt;/p&gt;${data([[&#x27;项目负责人&#x27;,p.contact],[&#x27;方案设计&#x27;,&#x27;苏设计师&#x27;],[&#x27;施工图设计&#x27;,&#x27;张设计师&#x27;],[&#x27;服务方式&#x27;,&#x27;项目群沟通，成果与确认统一留在项目内&#x27;]])}&lt;/section&gt;${btn(&#x27;联系项目负责人&#x27;,&#x27;item&#x27;,&#x27;data-item=&quot;feedback&quot;&#x27;)}&lt;div class=&quot;hy-note&quot;&gt;本原型不连接真实企微群或电话号码。&lt;/div&gt;`;}
  else if(k===&#x27;stage&#x27;){title=&#x27;施工图阶段&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;&lt;h2&gt;施工图设计&lt;/h2&gt;${data([[&#x27;当前状态&#x27;,&#x27;待启动&#x27;],[&#x27;计划交付&#x27;,plannedDate(p)],[&#x27;启动条件&#x27;,&#x27;上阶段成果确认及对应节点款到账，资料齐备&#x27;],[&#x27;预计成果&#x27;,&#x27;约定专业施工图及交底资料&#x27;]])}&lt;/section&gt;`;}
  else if(k===&#x27;thought&#x27;){title=&#x27;设计服务思路&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;&lt;span class=&quot;hy-tag&quot;&gt;免费售前文件&lt;/span&gt;&lt;h2&gt;办公空间设计服务思路&lt;/h2&gt;&lt;ul class=&quot;hy-list&quot;&gt;&lt;li&gt;先确认团队规模、协作方式及空间使用需求。&lt;/li&gt;&lt;li&gt;重点讨论访客接待、会议与办公动线。&lt;/li&gt;&lt;li&gt;明确设计范围与现场条件后形成正式报价。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;hy-sub&quot;&gt;示例内容；免费思路不替代正式阶段设计成果。&lt;/p&gt;&lt;/section&gt;`;}
  else if(k===&#x27;preview&#x27;){title=&#x27;成果评审内容&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;&lt;div class=&quot;hy-kicker&quot;&gt;方案设计 V${a===&#x27;old&#x27;?1:p.version} · 示例评审页&lt;/div&gt;&lt;h2&gt;本次交付内容&lt;/h2&gt;&lt;ul class=&quot;hy-list&quot;&gt;&lt;li&gt;平面布局：功能分区与主要动线&lt;/li&gt;&lt;li&gt;设计效果：公共区域与重点空间&lt;/li&gt;&lt;li&gt;材料意向：主要空间的色彩与材质&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;hy-preview&quot;&gt;&lt;h3&gt;评审关注点&lt;/h3&gt;&lt;p&gt;布局是否满足使用需求，重点空间的设计方向是否符合预期，是否存在遗漏的使用场景。&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;hy-sub&quot;&gt;真实产品应提供足够清晰、完整的评审文件。本页只演示阅读与确认的组织方式。&lt;/p&gt;&lt;/section&gt;${a===&#x27;old&#x27;?&#x27;&#x27;:btn(&#x27;返回成果详情&#x27;,&#x27;back&#x27;,&#x27;&#x27;,&#x27;hy-secondary&#x27;)}`;}
  else if(k===&#x27;concept&#x27;||k===&#x27;final&#x27;){title=k===&#x27;concept&#x27;?&#x27;概念设计成果&#x27;:&#x27;最终成果归档&#x27;;content=`&lt;section class=&quot;hy-box&quot;&gt;&lt;span class=&quot;hy-tag&quot;&gt;已确认 · 已交付&lt;/span&gt;&lt;h2&gt;${title}&lt;/h2&gt;${data([[&#x27;文件类型&#x27;,k===&#x27;concept&#x27;?&#x27;概念方向与布局说明&#x27;:&#x27;施工图、现场记录及验收资料&#x27;],[&#x27;当前权限&#x27;,&#x27;可下载原文件&#x27;],[&#x27;关联项目&#x27;,p.name]])}&lt;/section&gt;${btn(&#x27;下载原文件&#x27;,&#x27;download&#x27;)}`;}
  else{title=&#x27;项目记录&#x27;;content=&#x27;&lt;div class=&quot;hy-empty&quot;&gt;暂无记录。&lt;/div&gt;&#x27;;}
  return header(title,p.name,&#x27;具体事项&#x27;)+`&lt;main class=&quot;hy-body&quot;&gt;${content}&lt;/main&gt;`;
 }
 function render(){screen.innerHTML=(s.notice?`&lt;div class=&quot;hy-toast&quot; role=&quot;status&quot;&gt;${esc(s.notice)}&lt;/div&gt;`:&#x27;&#x27;)+(s.route.page===&#x27;list&#x27;?listPage():s.route.page===&#x27;detail&#x27;?detailPage(project()):itemPage(project()));}
 function modal(title,text,kind,label=&#x27;确认&#x27;,extra={}){pending={kind,...extra};root.querySelector(&#x27;#hy-dialog-title&#x27;).textContent=title;root.querySelector(&#x27;#hy-dialog-content&#x27;).innerHTML=`&lt;p&gt;${text}&lt;/p&gt;`;const b=root.querySelector(&#x27;#hy-dialog-confirm&#x27;);b.textContent=label;b.hidden=kind===&#x27;notice&#x27;;dialog.showModal();}
 function confirm(kind,index){const p=project();const configs={quote:[&#x27;确认服务方案与报价&#x27;,&#x27;确认的是全项目服务范围与报价，下一步签署全阶段服务合同。&#x27;,&#x27;确认并进入签约&#x27;],result:[&#x27;确认本阶段成果&#x27;,`本次确认关联方案设计 V${p.version}。确认后，本示例生成方案节点应付款 ${money(parts(p)[1])}。如仍有修改意见，请返回提交。`,&#x27;确认成果&#x27;],remit:[&#x27;通知平台核对款项&#x27;,&#x27;此操作仅表示您已办理付款；到账状态、文件权限及下一阶段启动条件，以平台核对结果为准。&#x27;,&#x27;通知核对&#x27;],scheduleYes:[&#x27;同意交付日期调整&#x27;,&#x27;施工图交付日将从11月20日更新为11月23日，原日期和确认记录会保留。&#x27;,&#x27;同意改期&#x27;],scheduleNo:[&#x27;暂不同意改期&#x27;,&#x27;保留原交付日期，并通知负责人继续沟通。&#x27;,&#x27;提交沟通请求&#x27;],addendumYes:[&#x27;确认新增服务&#x27;,`新增费用 ¥6,000，并入施工图节点款。全项目总价调整为 ${money(p.base+6000)}，当前方案款不变。`,&#x27;确认增补&#x27;],addendumNo:[&#x27;暂不接受新增服务&#x27;,&#x27;不增加费用，继续按原合同范围履行。&#x27;,&#x27;暂不接受&#x27;]};const c=configs[kind];if(c)modal(c[0],c[1],kind,c[2],{index});}
 function commit(){const p=project(),k=pending?.kind;dialog.close();
  if(k===&#x27;quote&#x27;){p.mode=&#x27;sign&#x27;;detailAfter(&#x27;方案报价已确认，下一步签署全阶段合同。&#x27;);}
  else if(k===&#x27;sign&#x27;){p.mode=&#x27;firstpay&#x27;;p.stage=0;detailAfter(&#x27;演示签约已完成，首款待支付。&#x27;);}
  else if(k===&#x27;result&#x27;){p.mode=&#x27;pay&#x27;;detailAfter(&#x27;方案成果已确认，方案节点款待支付。&#x27;);}
  else if(k===&#x27;remit&#x27;){p.remit=Number(pending.index);p.mode=&#x27;checking&#x27;;detailAfter(&#x27;已通知平台核对；当前尚未确认到账。&#x27;);}
  else if(k===&#x27;scheduleYes&#x27;||k===&#x27;scheduleNo&#x27;){p.schedule=k===&#x27;scheduleYes&#x27;?&#x27;accepted&#x27;:&#x27;declined&#x27;;detailAfter(k===&#x27;scheduleYes&#x27;?&#x27;改期已确认，日期与记录已更新。&#x27;:&#x27;已通知负责人沟通，保留原交付日期。&#x27;);}
  else if(k===&#x27;addendumYes&#x27;||k===&#x27;addendumNo&#x27;){p.addendum=k===&#x27;addendumYes&#x27;?&#x27;accepted&#x27;:&#x27;declined&#x27;;detailAfter(k===&#x27;addendumYes&#x27;?&#x27;增补已确认，款项计划与施工图交付日期已更新。&#x27;:&#x27;已记录暂不接受，继续按原合同服务。&#x27;);}
  else if(k===&#x27;reset&#x27;){s=fresh();render();persist();}
  pending=null;
 }
 root.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;[data-action]&#x27;);if(!b||!root.contains(b))return;const ac=b.dataset.action;
  if(ac===&#x27;open&#x27;)go({page:&#x27;detail&#x27;,id:b.dataset.id,tab:&#x27;overview&#x27;,item:&#x27;&#x27;,arg:&#x27;&#x27;});
  else if(ac===&#x27;back&#x27;)back();
  else if(ac===&#x27;list&#x27;)go(fresh().route);
  else if(ac===&#x27;filter&#x27;){s.filter=b.dataset.filter;render();persist();}
  else if(ac===&#x27;tab&#x27;){s.route.tab=b.dataset.tab;render();persist();}
  else if(ac===&#x27;item&#x27;)go({page:&#x27;item&#x27;,item:b.dataset.item,arg:b.dataset.arg||&#x27;&#x27;});
  else if(ac===&#x27;confirm&#x27;)confirm(b.dataset.kind,b.dataset.index);
  else if(ac===&#x27;dismiss&#x27;){dialog.close();pending=null;}
  else if(ac===&#x27;commit&#x27;)commit();
  else if(ac===&#x27;sign&#x27;){if(!root.querySelector(&#x27;#hy-contract-check&#x27;)?.checked){root.querySelector(&#x27;#hy-form-error&#x27;).textContent=&#x27;请先查看并勾选服务范围、总价与付款计划。&#x27;;return;}modal(&#x27;演示完成签约&#x27;,&#x27;本原型将展示双方签署完成后的状态，不会签署真实合同。&#x27;,&#x27;sign&#x27;,&#x27;完成签约演示&#x27;);}
  else if(ac===&#x27;submitRevision&#x27;||ac===&#x27;submitFeedback&#x27;){const msg=root.querySelector(&#x27;#hy-message&#x27;).value.trim();if(!msg){root.querySelector(&#x27;#hy-form-error&#x27;).textContent=&#x27;请填写具体内容，便于负责人处理。&#x27;;return;}if(ac===&#x27;submitRevision&#x27;){project().comment=msg;project().mode=&#x27;revising&#x27;;detailAfter(&#x27;修改意见已提交，已关联当前成果版本。&#x27;);}else{project().request={topic:root.querySelector(&#x27;#hy-topic&#x27;)?.value,text:msg};detailAfter(&#x27;请求已记录，由本项目负责人跟进（演示）。&#x27;);}}
  else if(ac===&#x27;download&#x27;)modal(&#x27;下载原文件&#x27;,&#x27;已展示下载权限。本原型不包含真实设计文件，不会产生实际下载。&#x27;,&#x27;notice&#x27;);
  else if(ac===&#x27;notice&#x27;)modal(&#x27;项目记录&#x27;,esc(b.dataset.message),&#x27;notice&#x27;);
  else if(ac===&#x27;navstub&#x27;)modal(&#x27;本次演示范围&#x27;,&#x27;本次完善项目与订单的三个层级，首页、发布、设置保留栏目位置。&#x27;,&#x27;notice&#x27;);
  else if(ac===&#x27;reset&#x27;)modal(&#x27;重新体验原型&#x27;,&#x27;将恢复四个示例项目的初始状态，清除本次演示操作。&#x27;,&#x27;reset&#x27;,&#x27;恢复示例&#x27;);
 });
 root.addEventListener(&#x27;input&#x27;,e=&gt;{if(e.target.id===&#x27;hy-message&#x27;){project()[s.route.item===&#x27;revision&#x27;?&#x27;revisionDraft&#x27;:&#x27;feedbackDraft&#x27;]=e.target.value;}});
 render();
})();
&lt;/script&gt;

    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
